<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Retirement Planner</title>
<style>:root{--ink:#15202B;--ink2:#3B4752;--muted:#5B6672;--line:#E3E7EC;--line2:#F0F2F5;--bg:#F4F6F8;--card:#FFFFFF;--dale:#2457C5;--daleBg:#EEF3FD;--sue:#E8913A;--sueInk:#A85A0F;--sueBg:#FDF1E4;--shared:#3B4752;--sharedBg:#EEF0F2;--warnBg:#FFF4D6;--warnInk:#6B4E00;--bad:#B42318;--good:#1E7B4A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Inter,system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--dale)}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
h2{margin:0;font-size:18px}
h3{margin:0;font-size:15px}
.hidden{display:none!important}
/* header */
.top{background:var(--ink);color:#fff;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:18px}
.file{font-size:13px;color:#B8C2CC}
.grow{flex:1 1 auto}
.seg{display:flex;background:#26333F;border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;border-radius:8px;padding:7px 14px;min-height:34px;background:transparent;color:#fff;cursor:pointer;font-size:14px}
.seg button.on{background:#fff;color:var(--ink);font-weight:600}
.status{font-size:13px;color:#B8C2CC}
.status.dirty{color:#FFD27A}
.tbtn{border:1px solid #5B6B7A;background:transparent;color:#fff;border-radius:8px;padding:7px 14px;min-height:34px;cursor:pointer;font-size:14px}
.tbtn.primary{background:#fff;color:var(--ink);border-color:#fff;font-weight:600}
/* layout */
.wrap{display:flex;flex-wrap:wrap;align-items:flex-start}
nav.side{flex:1 1 200px;max-width:230px;padding:20px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:62px}
nav.side button{text-align:left;border:0;background:transparent;padding:10px 14px;border-radius:8px;color:var(--ink2);cursor:pointer;font-size:15px}
nav.side button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
main{flex:999 1 560px;min-width:0;padding:22px 28px 60px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.sub{font-size:14px;color:var(--muted)}
.ml{margin-left:auto}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.card.dark .k-sub,.card.dark .k-lab{color:#B8C2CC}
.card.p-dale{border-top:4px solid var(--dale)}.card.p-sue{border-top:4px solid var(--sue)}.card.p-joint{border-top:4px solid #8A949E}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));align-items:start}
.k-lab{font-size:13px;color:var(--muted);font-weight:500}
.k-val{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.k-sub{font-size:13px;color:var(--muted)}
.dale{color:var(--dale)}.sue{color:var(--sueInk)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.dale{background:var(--daleBg);color:var(--dale)}.chip.sue{background:var(--sueBg);color:var(--sueInk)}.chip.shared,.chip.joint{background:var(--sharedBg);color:var(--shared)}
.note{background:var(--warnBg);color:var(--warnInk);border-radius:10px;padding:10px 14px;font-size:14px}
.tip{background:var(--daleBg);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink2)}
.badge{font-size:12px;background:var(--warnBg);color:var(--warnInk);padding:3px 10px;border-radius:999px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 12px;text-align:left;vertical-align:middle}
thead th{background:var(--bg);font-weight:600;color:var(--ink2);white-space:nowrap}
tbody tr{border-top:1px solid var(--line2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
tr.grp th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;background:#fff}
tr.tot{background:var(--bg);font-weight:700}
.card table th,.card table td{padding:7px 8px}
/* inputs */
input.in,select.in{border:1px solid #C9D0D7;border-radius:7px;padding:6px 8px;min-height:34px;background:#fff;width:100%;min-width:0}
input.in.num{text-align:right}
input.in:focus,select.in:focus{outline:2px solid var(--dale);outline-offset:0;border-color:var(--dale)}
input.in:disabled,select.in:disabled{background:var(--bg);color:var(--muted)}
.in.w90{width:96px}.in.w110{width:116px}.in.w70{width:76px}.in.w140{width:150px}.in.w200{width:230px}.in.w120{width:124px}
.btn{border:1px solid #C9D0D7;background:#fff;border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:14px;font-weight:500}
.btn.primary{background:var(--dale);border-color:var(--dale);color:#fff;font-weight:600}
.btn.danger{color:var(--bad)}
.btn.link{border:0;background:transparent;color:var(--dale);font-weight:600;padding:6px 4px;min-height:32px}
.ibtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2)}
.ibtn.del{color:var(--bad)}
.ibtn svg{width:15px;height:15px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lab{font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.slider{display:flex;flex-direction:column;gap:4px}
.slider .top2{display:flex;justify-content:space-between;font-size:14px;font-weight:600;gap:8px}
.slider input[type=range]{accent-color:var(--dale);width:100%}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:8px 10px;border-radius:8px;white-space:nowrap;z-index:5;transform:translate(-50%,-110%)}
/* bracket bars */
.bar{background:var(--line2);border-radius:4px;height:12px;overflow:hidden}
.bar>div{height:12px;border-radius:4px}
.ms{display:flex;gap:12px;font-size:14px}.ms b{width:86px;flex:0 0 86px;color:var(--muted)}
/* unlock */
.lock{min-height:100vh;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:30px 16px}
.lockbox{width:100%;max-width:470px;display:flex;flex-direction:column;gap:18px}
.lockbox .t{color:#fff;text-align:center}
.lockbox .t div:first-child{font-size:26px;font-weight:700}
.lockbox .t div:last-child{font-size:14px;color:#B8C2CC}
.panel{background:#fff;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who label{border:1px solid #C9D0D7;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.who label.on{border:2px solid var(--dale)}
.sec{background:#26333F;color:#DCE3EA;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.5}
.err{color:var(--bad);font-size:14px;font-weight:600}
.rkey{font:700 20px/1.4 Consolas,monospace;letter-spacing:.06em;background:var(--bg);border-radius:8px;padding:12px;text-align:center;word-break:break-all}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.2)}
@media (max-width:760px){
 .top{padding:10px 12px;gap:8px;position:static}
 .top .file,.top .status{display:none}
 .top .brand{font-size:16px;flex:1 1 auto}
 .top .grow{display:none}
 .top .seg{order:5;flex:1 1 auto}
 .top .seg button{flex:1 1 0;padding:7px 8px}
 nav.side{max-width:none;flex:1 1 100%;flex-direction:row;overflow-x:auto;position:sticky;top:0;z-index:15;background:var(--bg);padding:8px 10px;gap:6px;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line)}
 nav.side button{white-space:nowrap;padding:8px 12px;font-size:14px;flex:0 0 auto;background:#fff;border:1px solid var(--line)}
 nav.side button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
 main{padding:14px 12px 40px;gap:14px}
 h1{font-size:22px}
 .card{padding:14px}
 .k-val{font-size:24px}
 .grid2{grid-template-columns:minmax(0,1fr)}
 .grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
 input.in,select.in,.lock input.in{font-size:16px}
 .head .ml{margin-left:0}
 .inc .r2{grid-template-columns:minmax(0,1fr)}
 .ms b{width:70px;flex:0 0 70px}
}
.nojs{background:#B42318;color:#fff;padding:16px 20px;font:16px/1.5 system-ui,sans-serif}
.nojs b{display:block;font-size:18px;margin-bottom:4px}
@media print{.top,nav.side,.btn,.ibtn{display:none!important}main{padding:0}}

td.nw,th.nw{white-space:nowrap}
td.ev{min-width:260px}
.inc{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:8px;align-items:center;border-top:1px solid var(--line2);padding-top:10px}
.inc .r2{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}

details.help summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::before{content:'+';font-weight:700;color:var(--dale);width:16px}
details.help[open] summary::before{content:'–'}
details.help summary h2{display:inline}
.hbody{font-size:15px;line-height:1.6;color:var(--ink2)}
.hbody ul,.hbody ol{margin:6px 0;padding-left:22px}.hbody li{margin:4px 0}
.hbody dt{font-weight:700;color:var(--ink);margin-top:8px}.hbody dd{margin:2px 0 0 0}
.helpnav{display:flex;flex-wrap:wrap;gap:6px}
.helpnav a{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none}
.lock .card.help,.lock .helpnav a{background:#fff}
.lock .lab{color:#fff}
@media print{.helpnav,#helpQ,.lab[for=helpQ]{display:none!important}details.help{break-inside:avoid;border:0}}
details.help{scroll-margin-top:80px}
details.help:not([open]){gap:0;padding-top:14px;padding-bottom:14px}
</style>

<li>A <b>recovery key</b> appears. Write it down or print it and keep it somewhere safe – <b>not</b> in OneDrive. Tick the box.</li>
<li>Save the plan file (e.g. <b>Retirement-Plan.rplan</b>) into your shared OneDrive folder.</li>
<li>Fill in the Budget, Income &amp; Tax and Savings &amp; Super tabs, then Save.</li>
</ol>
<p><b>Everyone after that:</b> open the planner, click <b>Choose plan file…</b>, pick the plan file from OneDrive, select your name and enter your password.</p>`],
 ['daily', 'Opening, saving and locking', `
<ul>
<li><b>Open:</b> double-click the <b>Retirement-Planner-v….html</b> file with the highest version number. After the first time it offers <b>Open Retirement-Plan.rplan</b> – click it, choose your name, enter your password. The browser may ask to allow access to the file – click <b>Allow</b>/<b>Edit files</b>.</li>
<li><b>Save:</b> click <b>Save</b> (top right) or press <b>Ctrl+S</b>. The status turns yellow – <i>Unsaved changes</i> – until you do. The browser warns you if you close with unsaved changes.</li>
<li><b>If you both edit at once:</b> when you save, the app checks whether the other person saved in the meantime and asks: <b>OK</b> keeps your version, <b>Cancel</b> loads theirs. Easiest is to agree that one person edits at a time.</li>
<li><b>Lock:</b> the padlock button locks the plan straight away. It also locks itself after 15 minutes idle (change this under <i>Users &amp; passwords</i>) and saves first if needed.</li>
<li><b>If Save downloads a file instead</b> (Safari, or a browser setting): move the downloaded <b>Retirement-Plan.rplan</b> into the OneDrive folder, replacing the old one.</li>
</ul>`],
 ['top', 'The top bar: views and Separate vs Pooled', `
<ul>
<li><b>Household / {P1} / {P2}</b> changes whose figures are shown on the Dashboard, Budget, Income &amp; Tax and Savings screens. It doesn't change any numbers.</li>
<li><b>Separate</b>: each of you pays your own share of spending from your own money. Shows how long each person's money lasts on its own.</li>
<li><b>Pooled</b>: one shared pot – if one of you runs short, the other tops up. The Dashboard shows who tops up whom.</li>
</ul>`],
 ['dash', 'Dashboard', `
<ul>
<li><b>Net worth today</b> – all accounts, including any defined benefit estimate.</li>
<li><b>Shared money runs out when you're …</b> (Pooled) – the ages you'll <i>both</i> be in the year the shared money runs out. The line underneath shows how long each person's own money lasts on its own. With <b>Separate</b> selected it shows each person's own money instead.</li>
<li><b>Retirement spend</b> – the combined yearly amount, each person's share, and the most you could spend and still last to the "plan to" age (95).</li>
<li><b>Projected balances</b> – hover over a bar to see each person's balance that year. Dashed lines mark retirements.</li>
<li><b>Retirement income – combined and split</b> – the first full year you're both retired, in <i>future</i> dollars. <b>Spending to cover</b> = your combined yearly retirement amount (Budget tab, e.g. $130,000 in today's dollars) × each person's split (e.g. 50/50) × inflation up to that year (3% a year: four years ≈ ×1.13, so $65,000 becomes about $73,000 each). The rows below show where it comes from – super pension, Age Pension, other income and cash – and the tax each of you pays. Change the split here: a percentage, or <i>By each person's budget</i> (your shares in proportion to your Budget "In retirement" amounts). The split only applies when Budget is set to <i>a combined yearly amount</i>; when it uses the <i>In retirement</i> column, each person's own column is used and there is nothing to split.</li>
<li><b>Retirement budget</b> card – your combined retirement amount (e.g. $130,000) against what you've planned to spend in the Budget <i>In retirement</i> column, with the surplus (green) or deficit (red), for the household and each of you.</li>
<li><b>Milestones</b> and the <b>Separate vs pooled</b> comparison sit at the bottom.</li>
</ul>`],
 ['howcalc', 'How the numbers are worked out', `
<ul>
<li><b>Spending before retirement</b> – each person's Budget lines ("Now" amounts), shared items split by the %.</li>
<li><b>Spending in retirement</b> – either the <i>combined yearly amount</i> split between you, or each person's <i>In retirement</i> column (Budget tab › "In retirement, base spending on"). Optional steps with age (Forecast › Spending changes as we age).</li>
<li><b>Inflation</b> – today's dollars are grown by the Assumptions rate (3%) each year; charts and year-by-year tables are in future dollars.</li>
<li><b>Income</b> – work income until each retirement date; interest at each cash account's own rate; super pension drawdowns (at least the legal minimum); Age Pension from 67 if the assets and income tests allow.</li>
<li><b>Tax</b> – each person separately at resident rates plus Medicare, less offsets and franking credits. Super pensions are tax-free after 60; deductible super contributions reduce taxable income and are taxed 15% in the fund.</li>
<li><b>Running short</b> – cash is used first, then super (once accessible), then shares. With <b>Pooled</b>, one partner tops up the other; the money "runs out" when the shared total can't cover the year's spending.</li>
<li><b>Not included</b> – see "What the planner doesn't do" below.</li>
</ul>`],
 ['budget', 'Budget – adding, changing and deleting expenses', `
<ul>
<li><b>Change an amount:</b> type in <b>Weekly</b>, <b>Monthly</b> or <b>Yearly</b> – the others update when you press Tab or click away.</li>
<li><b>In retirement /yr:</b> leave blank if it stays the same; enter a new amount if it changes; enter <b>0</b> if it stops (e.g. work costs).</li>
<li><b>Owner:</b> {P1}, {P2} or Shared. For Shared, enter the <b>full</b> bill and the split %: in your own view it's <i>your</i> share ("% {P2}" in {P2}'s view), in the Household view it's {P1}'s share. 50 = half each.</li>
<li><b>Add:</b> <b>+ Add</b> beside a category, or <b>+ Add expense</b> at the top for a new category. Then type the name and amount.</li>
<li><b>Move</b> an item to another category with the drop-down on the right; <b>delete</b> with the red bin (it asks first).</li>
<li><b>One-off future costs:</b> cars, trips, renovations. Choose the financial year it happens in, the cost in today's dollars, and "repeat every" years (0 = once). Tick <b>Paid</b> once it's paid – your balances already reflect it, so it isn't counted again.</li>
<li><b>In retirement, base spending on:</b> either one <b>combined yearly amount</b> (e.g. $120,000 split 50/50) or the <b>In retirement</b> column. Before each person retires, the <b>Now</b> amounts are used.</li>
<li><b>Surplus or deficit:</b> each person's card compares their <b>In retirement</b> spending with their share of the combined retirement budget (e.g. $65,000 each of $130,000). <span style="color:var(--good)">Green ▲ Surplus</span> = you plan to spend less than your budget; <span style="color:var(--bad)">red ▼ Deficit</span> = more. The forecast uses whichever basis is chosen above – the budget amount, or the column. If you actually spend less than the budget, the unspent money stays in your balances and shows up when you update them on Savings &amp; Super.</li>
</ul>`],
 ['tax', 'Income & Tax', `
<ul>
<li>Pick a financial year at the top to see that year's income and tax.</li>
<li><b>Retirement date</b> for each person is at the top of their card. Change it here and every screen updates – the dashboard, forecast, scenarios and tax.</li>
<li><b>Income streams:</b> add, edit or delete. Types:
  <ul><li><b>Work (to retirement)</b> – consulting, salary; stops automatically at that person's retirement date.</li>
  <li><b>Other taxable</b> – e.g. rent, part-time work after retiring (set From/To dates).</li>
  <li><b>Tax-free</b> – e.g. a gift or inheritance.</li></ul></li>
<li>Interest, dividends and franking come from <b>Savings &amp; Super</b> automatically – don't add them here.</li>
<li><b>Tax by bracket</b> shows how the tax is worked out, the effective rate and the rate on your next dollar.</li>
<li><b>Business (sole trader):</b> one row per BAS quarter – sales and expenses (ex GST), GST collected (1A), GST credits (1B), PAYG instalment and a Paid tick. Type figures in, or use <b>Import from Zoho Books…</b>. Blank GST boxes are estimated at 10% until you enter the real figure. The cards underneath compare your net profit so far with your own yearly estimate (which still drives the forecast), show GST owing, and estimate what you'll pay or get back at tax time after your PAYG instalments.</li>
<li><b>Importing from Zoho Books:</b> in Zoho Books open <i>Reports › Profit and Loss</i> (or the <i>BAS / GST</i> report), choose one quarter's dates, then <i>Export › Excel (XLSX)</i> – not PDF. In the planner click <b>Import from Zoho Books…</b> and pick the file. A preview shows what was found and which quarter it goes into; nothing changes until you click <b>Apply</b>. A year-to-date Profit and Loss fills the expense categories. The file is read on your computer only – nothing is sent anywhere.</li>
<li><b>Deductible super contributions</b>: enter a yearly amount to see the tax saving. Check caps with your accountant.</li>
</ul>`],
 ['savings', 'Savings & Super', `
<ul>
<li><b>+ Add account</b> under {P1}, {P2} or Joint. Choose the type: Cash, Super – accumulation, Super – pension, Shares, Crypto or Defined benefit.</li>
<li>Update <b>balances</b> every few months, then press <b>Record today's balances</b> to add a dated row to the history.</li>
<li><b>Interest / return %:</b> each cash account's interest rate (e.g. 5.25% goal saver) is used every year. Super accounts can have their own return; leave it blank to use the <b>Super return</b> on Assumptions (e.g. 4%).</li>
<li><b>Joint accounts</b> are split 50/50 and only counted if "In forecast" is ticked.</li>
<li><b>Defined benefit</b> (e.g. QSuper): the <b>Benefit amount</b> overrides the formula. When the statement arrives, enter the real amount – or clear it and enter the <b>multiple</b> and <b>final salary</b>. Choose whether it goes to a pension, cash or a mix when she leaves.</li>
</ul>`],
 ['forecast', 'Forecast & Scenarios – testing "what ifs"', `
<ul>
<li>Use the <b>Combined / {P1} / {P2}</b> switch (top right) to see the comparison, chart and year-by-year table for the household or for each of you. The person views show income, super drawdowns, Age Pension, tax, spending, balances and any top-ups between you.</li>
<li><b>Base plan</b> is your real plan – changing it here changes the plan everywhere.</li>
<li><b>+ New scenario</b> or the copy button makes a "what if" (e.g. <i>Retire at 58</i>, <i>Spend $140k</i>). Click its name to edit: retirement dates, spending, split, returns, inflation, and a <b>market fall</b> test in {P1}'s retirement year.</li>
<li><b>Spending changes as we age:</b> tick it in the left panel and set up to two steps – e.g. from 75 spend 20% less (less travel), from 85 a further 10% less, or slide right to spend <i>more</i> for health costs. Ages follow the younger of you. Each scenario can have its own steps, so copy the Base plan and compare.</li>
<li>The ticks only choose which <b>two</b> scenarios appear side by side in the comparison table. Scenarios never change your plan or the Dashboard – only the <b>Base plan</b> does. Delete any you don't need (e.g. the examples).</li>
<li>The <b>year by year</b> table shows spending, tax, Age Pension and balances; red rows mean the money has run out.</li>
<li><b>Export to Excel (CSV)</b> saves the year-by-year figures to open in Excel.</li>
</ul>`],
 ['assumptions', 'Assumptions ({P1} only)', `
<ul>
<li>Inflation, interest and super returns, tax brackets, super rules, Age Pension limits and the "plan to" age.</li>
<li><b>Check each July</b> (new tax year) and after Age Pension changes in March and September. Each section shows when it was last updated.</li>
<li><b>Reset to defaults</b> restores the built-in values only – your accounts, budget and income stay as they are.</li>
<li>{P2} can see these but not change them.</li>
</ul>`],
 ['users', 'Passwords, recovery key and access', `
<ul>
<li><b>Change my password:</b> <i>Users &amp; passwords</i> › enter it twice › <b>Change password</b> › <b>Save</b>.</li>
<li><b>{P2} forgot their password:</b> {P1} logs in › <i>Users &amp; passwords</i> › set a new one for {P2} › <b>Save</b>.</li>
<li><b>{P1} forgot his password:</b> on the login screen click <b>Forgot password? Use recovery key</b>, type the key, then set a new password and <b>Save</b>.</li>
<li><b>Keep me signed in on this device:</b> tick the box under the password (or use <i>Users &amp; passwords › This device</i>). After a refresh or when you come back, just choose the plan file – or tap <b>Continue as …</b> – with no password. The password itself is never stored. Only do this on your own phone, tablet or computer with a screen lock. <b>Forget this device</b> turns it off; changing your password turns it off on every device.</li>
<li><b>New recovery key:</b> {P1} can create one any time; the old key stops working after you Save.</li>
<li>If both {P1}'s password and the recovery key are lost, the plan cannot be opened by anyone – that's what keeps it private.</li>
</ul>`],
 ['security', 'How your information is protected', `
<ul>
<li>Everything is worked out inside your browser. The app is blocked from connecting to the internet.</li>
<li>The plan file is encrypted (AES-256). OneDrive only ever stores the locked file – without a password it's unreadable.</li>
<li>{P1} and {P2} each have their own password; {P1} is the admin.</li>
<li>Don't save passwords in the browser on shared computers, and keep the recovery key offline.</li>
<li>Back-up: OneDrive keeps previous versions (right-click the file › <i>Version history</i>). <b>Save a copy as…</b> under <i>Users &amp; passwords</i> makes a dated copy.</li>
</ul>`],
 ['yearly', 'Suggested routine', `
<ul>
<li><b>Every 3 months:</b> update balances on Savings &amp; Super › <b>Record today's balances</b> › Save.</li>
<li><b>When things change:</b> new expenses, income, retirement dates, defined benefit statement figures.</li>
<li><b>Each July:</b> review Assumptions (tax rates, super rules), then check the Dashboard.</li>
<li><b>Before big decisions:</b> make a scenario and compare it with the Base plan.</li>
</ul>`],
 ['trouble', 'Troubleshooting', `
<ul>
<li><b>"Wrong password"</b> – check Caps Lock and that the right name ({P1}/{P2}) is selected.</li>
<li><b>Nothing happens / blank page</b> – open it in Edge or Chrome, not Internet Explorer or a preview pane.</li>
<li><b>"Open Retirement-Plan.rplan" doesn't work</b> – use <b>Choose plan file…</b> and pick it from the OneDrive folder.</li>
<li><b>OneDrive shows a conflict copy</b> (e.g. <i>Retirement-Plan-DESKTOP.rplan</i>) – you both saved at once. Open each, keep the right one, delete the other.</li>
<li><b>Figures look odd</b> – check retirement dates, the "In retirement" column (blank vs 0), and the Assumptions page.</li>
<li><b>Phones and tablets are view only.</b> You can change any figure – budget, dates, sliders – to try ideas, but nothing is saved; the top bar says <i>Trying changes – not saved</i> and <b>Discard changes</b> puts the saved figures back. Make permanent changes on a PC. If a tablet is ever treated as a PC (or the other way round), change <i>Users &amp; passwords › This device › Editing on this device</i>.</li>
<li><b>Phones and tablets</b> (iPhone, iPad, Android, Samsung tablets) – use the <b>web address</b>: {URL}. Opening the planner <i>file</i> on a phone or tablet doesn't work: it shows as a preview with dead buttons, or every file is greyed out when choosing the plan.
  <ul><li>Open the web address in Chrome or Safari, tap <b>Choose plan file…</b>, then pick the plan file from <b>OneDrive</b> (tap ☰ or <i>Browse</i> if it isn't listed).</li>
  <li><b>Add to home screen</b> (Safari: Share › Add to Home Screen; Chrome: ⋮ › Add to home screen) to open it like an app.</li>
  </ul></li>
</ul>`],
 ['terms', 'Glossary', `
<dl>
<dt>Accumulation (super)</dt><dd>Super while you're still working or under 60 – earnings taxed at 15%.</dd>
<dt>Pension phase / account-based pension</dt><dd>Super paying you an income after retirement – tax-free from 60, with a minimum yearly withdrawal (4% under 65, 5% from 65, rising with age).</dd>
<dt>Defined benefit</dt><dd>A scheme such as QSuper's – a set amount worked out as multiple × final salary, not based on market returns.</dd>
<dt>Preservation age</dt><dd>60 – the age super can be accessed once retired.</dd>
<dt>Marginal rate</dt><dd>The tax rate on your next dollar of income (includes the 2% Medicare levy).</dd>
<dt>Effective rate</dt><dd>Total tax ÷ taxable income.</dd>
<dt>Franking credits</dt><dd>Tax already paid by a company on dividends – refunded or used to reduce your tax.</dd>
<dt>Age Pension assets/income tests</dt><dd>Centrelink checks both and pays the lower result. Your home isn't counted.</dd>
<dt>Today's dollars vs future dollars</dt><dd>Today's dollars remove inflation, so $120k means what $120k buys now. Charts and tables show future dollars.</dd>
</dl>`],
 ['limits', "What the planner doesn't do", `
<ul>
<li>Capital gains tax when selling shares or crypto, the seniors tax offset, Division 293 tax, aged care costs and estate planning aren't modelled.</li>
<li>Returns are the same every year (apart from the market-fall test). Real markets go up and down.</li>
<li>Age Pension figures are estimates – check with Services Australia closer to 67.</li>
<li>This is a planning tool, not financial or tax advice. Run big decisions past a licensed adviser or accountant.</li>
</ul>`]

    contRem: function () { continueRemembered(); },
    forgetDev: async function () { await Vault.Device.forget(S.file); S.devInfo = null; if (S.plan) { render(); toast('This device will ask for the password next time.'); } else renderLock(); },
    keepDev: async function () { if (S.user === 'recovery') { alert('Set a new password first, then sign in with it.'); return; } try { await Vault.Device.remember(S.file, S.user, S.dataKey); S.devInfo = await Vault.Device.info(S.file); render(); toast('This device will keep you signed in.'); } catch (e) { alert('This browser could not keep you signed in: ' + e.message); } },
    // lock screen
    openFile: async function () { try { var f = await Files.openPicker(); if (!f || f.format !== 'retirement-plan') throw new Error('That file is not a Retirement Planner plan (.rplan). Choose the plan file from your OneDrive folder.'); S.file = f; await afterFileChosen(true); } catch (e) { if (e.name !== 'AbortError') { S.err = e.message; alert(e.message); } } },
    reopen: async function () { try { S.file = await Files.reopenLast(); await afterFileChosen(true); } catch (e) { alert('Could not open it: ' + e.message + '\nUse "Choose plan file…" instead.'); } },
    backFile: function () { S.stage = 'file'; S.err = ''; renderLock(); },
    who: function (id) { S.loginWho = id; renderLock(); },
    toggleRec: function () { S.recovery = !S.recovery; S.err = ''; renderLock(); },
    unlock: unlockNow,
    startCreate: function () { S.stage = 'create'; S.err = ''; renderLock(); },
    create: async function () {
      var a = document.getElementById('pw1_dale').value, b = document.getElementById('pw2_dale').value, c = document.getElementById('pw1_sueNew').value, d2 = document.getElementById('pw2_sueNew').value;
      var v = function (id) { return (document.getElementById(id).value || '').trim(); };
      var n1 = v('cr_n1'), n2 = v('cr_n2'), d1 = v('cr_d1'), d2d = v('cr_d2');
      if (!n1 || !n2) { S.err = 'Enter both first names.'; return renderLock(); }
      if (!d1 || !d2d) { S.err = 'Enter both dates of birth.'; return renderLock(); }
      if (a.length < 8) { S.err = n1 + "'s password needs at least 8 characters."; return renderLock(); }
      if (a !== b) { S.err = n1 + "'s passwords don't match."; return renderLock(); }
      if (c && c.length < 8) { S.err = n2 + "'s password needs at least 8 characters."; return renderLock(); }
      if (c !== d2) { S.err = n2 + "'s passwords don't match."; return renderLock(); }
      var at65 = function (dob) { var x = new Date(dob + 'T00:00:00'); x.setFullYear(x.getFullYear() + 65); return x.toISOString().slice(0, 10); };
      S.busy = true; S.err = ''; renderLock();
      var plan = RP_DEFAULT_PLAN();
      plan.people.dale.name = n1; plan.people.dale.dob = d1; plan.people.dale.retireDate = v('cr_r1') || at65(d1);
      plan.people.sue.name = n2; plan.people.sue.dob = d2d; plan.people.sue.retireDate = v('cr_r2') || at65(d2d);
      plan.scenarios[0].note = n1 + ' retires ' + plan.people.dale.retireDate.slice(0, 4);
      var r = await Vault.create(plan, { dale: a, sue: c || null }, 'dale');
      S.file = r.file; S.dataKey = r.dataKey; S.plan = null; S.pendingPlan = plan; S.newRecovery = r.recoveryKey; S.busy = false; S.stage = 'recovery'; renderLock();
    },
    afterCreate: async function () {
      if (!document.getElementById('rkOk').checked) { alert('Please tick the box once you have written the recovery key down.'); return; }
      try { var res = await Files.save(S.file, true); S.plan = S.pendingPlan; S.user = 'dale'; S.newRecovery = null; S.tab = 'dashboard'; S.dirty = false; S.lastSaved = new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }); render(); toast(res.mode === 'download' ? 'Downloaded ' + res.name + ' – move it into your OneDrive folder.' : 'Plan saved to ' + res.name); }
      catch (e) { if (e.name !== 'AbortError') alert('Could not save: ' + e.message); }
    }
  };

  /* ---------- events ---------- */
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t || t.tagName === 'SELECT') return;
    if (t.type === 'radio' || t.type === 'checkbox') { if (A[t.dataset.act]) A[t.dataset.act](t.dataset.id); return; }
    var f = A[t.dataset.act]; if (f) { e.preventDefault(); f(t.dataset.id); }
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.act === 'lockMins') { S.lockMins = +t.value; return; }
    if (t.dataset.act === 'bizTarget') { S.bizPreview.target = t.value; render(); return; }
    if (t.dataset.act === 'bizCats') { S.bizPreview.withCats = t.checked; return; }
    if (t.dataset.act === 'devMode') {
      if (t.value === 'edit' && ENV.mobile && !confirm('This looks like a phone or tablet, which normally can\'t save into OneDrive. Allow editing anyway?')) { t.value = DEVICE_MODE; return; }
      if (S.dirty && !VIEW_ONLY && t.value === 'view' && !confirm('You have unsaved changes. Switch to view only anyway?')) { t.value = DEVICE_MODE; return; }
      DEVICE_MODE = t.value; try { localStorage.setItem('rp-device-mode', DEVICE_MODE); } catch (e) {}
      VIEW_ONLY = DEVICE_MODE === 'view' ? true : DEVICE_MODE === 'edit' ? false : ENV.mobile; render(); toast(VIEW_ONLY ? 'This device is now view only.' : 'Editing and saving allowed on this device.'); return;
    }
    if (t.dataset.bind) {
      var type = t.dataset.type, v = type === 'bool' ? t.checked : parseVal(t.value, type);
      setPath(t.dataset.bind, v);
      if (t.dataset.grp) S.plan.assumptions.updated[t.dataset.grp] = new Date().toISOString().slice(0, 10);
      if (type === 'sel' && /accounts:.*:type$/.test(t.dataset.bind)) { var acc = S.plan.accounts.filter(function (a) { return a.id === t.dataset.bind.split(':')[1]; })[0]; if (acc && acc.type === 'db' && acc.leaveDate == null) { acc.leaveDate = ''; acc.dest = 'pension'; acc.override = ''; } }
      markDirty(); render(); return;
    }
    if (t.dataset.per) { var ex = S.plan.expenses.filter(function (x) { return x.id === t.dataset.id; })[0]; ex.yearly = Math.round(parseVal(t.value, 'money') * (+t.dataset.per) * 100) / 100; markDirty(); render(); return; }
    if (t.dataset.scen) { var sc = scenById(S.scen); sc[t.dataset.scen] = t.value; markDirty(); render(); return; }
    if (t.dataset.step) {
      var scS = scenById(S.scen), st = JSON.parse(JSON.stringify(stepsOf(scS))), k = t.dataset.step;
      st[k] = k === 'on' ? t.checked : (k === 'p1' || k === 'p2') ? +t.value / 100 : +t.value;
      setSteps(scS, st); markDirty(); render(); return;
    }
    if (t.dataset.sf) {
      var f = SF.filter(function (x) { return x[0] === t.dataset.sf; })[0], sc2 = scenById(S.scen);
      var val = f[2] === 'date' ? t.value : +t.value;
      if (f[0] === 'splitPct' && S.view === 'sue') val = 100 - val; // Sue's view shows her share
      if (sc2.id === 'base') { if (f[3]) setPath(f[3], val); else sc2.stress = val; } else sc2[f[0]] = val;
      markDirty(); render();
    }
  });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.step && t.type === 'range') { var lb = t.parentNode.querySelector('.top2 span:last-child'), v = +t.value; lb.textContent = t.dataset.fmt === 'pct' ? (v === 0 ? 'no change' : (v > 0 ? '+' : '−') + Math.abs(v) + '%') : 'age ' + v; }
    if (t.dataset.sf && t.type === 'range') { var lab = t.parentNode.querySelector('.top2 span:last-child'); var f = SF.filter(function (x) { return x[0] === t.dataset.sf; })[0]; var v = +t.value; lab.textContent = f[2] === 'pct' ? pct(v, f[0] === 'stress' ? 0 : 2) : f[2] === 'money' ? money(v) : Math.round(v) + '%'; }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'helpQ') { S.helpQ = e.target.value; filterHelp(); }
  });
  app.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'pw') unlockNow(); });
  // chart tooltip
  app.addEventListener('mousemove', function (e) {
    var t = e.target, ch = document.getElementById('chart'); if (!ch) return;
    var tt = ch.querySelector('.tt');
    if (t.classList && t.classList.contains('hit')) {
      if (!tt) { tt = document.createElement('div'); tt.className = 'tt'; ch.appendChild(tt); }
      var r = ch.getBoundingClientRect(); tt.style.left = (e.clientX - r.left) + 'px'; tt.style.top = (e.clientY - r.top) + 'px'; tt.textContent = t.getAttribute('data-tip');
    } else if (tt) tt.remove();
  });
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 's' && S.plan) { e.preventDefault(); saveNow(false); } });
  async function discardChanges() {
    try {
      var d = S.file.data, iv = Uint8Array.from(atob(d.iv), function (c) { return c.charCodeAt(0); }), ct = Uint8Array.from(atob(d.ct), function (c) { return c.charCodeAt(0); });
      var plan = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, S.dataKey, ct)));
      migratePlan(plan); S.plan = plan; S.dirty = false; S.pendingSlots = null; render(); toast('Back to the saved plan.');
    } catch (e) { alert('Could not reload the saved plan: ' + (e.message || e)); }
  }
  window.addEventListener('beforeunload', function (e) { if (S.plan && S.dirty && !VIEW_ONLY) { e.preventDefault(); e.returnValue = ''; } });
  // auto-lock
  var idle = Date.now();
  ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, function () { idle = Date.now(); }, { passive: true }); });
  setInterval(function () { if (S.plan && Date.now() - idle > S.lockMins * 60000) lockNow(true); }, 30000);
  function afterRender() {}

  // start
  Files.lastName().then(function (n) { S.lastName = n; renderLock(); });
  renderLock();
  window.__RP = S;
})();

</script>
</body>
