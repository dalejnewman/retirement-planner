<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Retirement Planner</title>
<style>:root{--ink:#15202B;--ink2:#3B4752;--muted:#5B6672;--line:#E3E7EC;--line2:#F0F2F5;--bg:#F4F6F8;--card:#FFFFFF;--dale:#2457C5;--daleBg:#EEF3FD;--sue:#E8913A;--sueInk:#A85A0F;--sueBg:#FDF1E4;--shared:#3B4752;--sharedBg:#EEF0F2;--warnBg:#FFF4D6;--warnInk:#6B4E00;--bad:#B42318;--good:#1E7B4A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Inter,system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--dale)}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
h2{margin:0;font-size:18px}
h3{margin:0;font-size:15px}
.hidden{display:none!important}
/* header */
.top{background:var(--ink);color:#fff;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:18px}
.file{font-size:13px;color:#B8C2CC}
.grow{flex:1 1 auto}
.seg{display:flex;background:#26333F;border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;border-radius:8px;padding:7px 14px;min-height:34px;background:transparent;color:#fff;cursor:pointer;font-size:14px}
.seg button.on{background:#fff;color:var(--ink);font-weight:600}
.status{font-size:13px;color:#B8C2CC}
.status.dirty{color:#FFD27A}
.tbtn{border:1px solid #5B6B7A;background:transparent;color:#fff;border-radius:8px;padding:7px 14px;min-height:34px;cursor:pointer;font-size:14px}
.tbtn.primary{background:#fff;color:var(--ink);border-color:#fff;font-weight:600}
/* layout */
.wrap{display:flex;flex-wrap:wrap;align-items:flex-start}
nav.side{flex:1 1 200px;max-width:230px;padding:20px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:62px}
nav.side button{text-align:left;border:0;background:transparent;padding:10px 14px;border-radius:8px;color:var(--ink2);cursor:pointer;font-size:15px}
nav.side button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
main{flex:999 1 560px;min-width:0;padding:22px 28px 60px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.sub{font-size:14px;color:var(--muted)}
.ml{margin-left:auto}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.card.dark .k-sub,.card.dark .k-lab{color:#B8C2CC}
.card.p-dale{border-top:4px solid var(--dale)}.card.p-sue{border-top:4px solid var(--sue)}.card.p-joint{border-top:4px solid #8A949E}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));align-items:start}
.k-lab{font-size:13px;color:var(--muted);font-weight:500}
.k-val{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.k-sub{font-size:13px;color:var(--muted)}
.dale{color:var(--dale)}.sue{color:var(--sueInk)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.dale{background:var(--daleBg);color:var(--dale)}.chip.sue{background:var(--sueBg);color:var(--sueInk)}.chip.shared,.chip.joint{background:var(--sharedBg);color:var(--shared)}
.note{background:var(--warnBg);color:var(--warnInk);border-radius:10px;padding:10px 14px;font-size:14px}
.tip{background:var(--daleBg);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink2)}
.badge{font-size:12px;background:var(--warnBg);color:var(--warnInk);padding:3px 10px;border-radius:999px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 12px;text-align:left;vertical-align:middle}
thead th{background:var(--bg);font-weight:600;color:var(--ink2);white-space:nowrap}
tbody tr{border-top:1px solid var(--line2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
tr.grp th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;background:#fff}
tr.tot{background:var(--bg);font-weight:700}
.card table th,.card table td{padding:7px 8px}
/* inputs */
input.in,select.in{border:1px solid #C9D0D7;border-radius:7px;padding:6px 8px;min-height:34px;background:#fff;width:100%;min-width:0}
input.in.num{text-align:right}
input.in:focus,select.in:focus{outline:2px solid var(--dale);outline-offset:0;border-color:var(--dale)}
input.in:disabled,select.in:disabled{background:var(--bg);color:var(--muted)}
.in.w90{width:96px}.in.w110{width:116px}.in.w70{width:76px}.in.w140{width:150px}.in.w200{width:230px}.in.w120{width:124px}
.btn{border:1px solid #C9D0D7;background:#fff;border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:14px;font-weight:500}
.btn.primary{background:var(--dale);border-color:var(--dale);color:#fff;font-weight:600}
.btn.danger{color:var(--bad)}
.btn.link{border:0;background:transparent;color:var(--dale);font-weight:600;padding:6px 4px;min-height:32px}
.ibtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2)}
.ibtn.del{color:var(--bad)}
.ibtn svg{width:15px;height:15px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lab{font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.slider{display:flex;flex-direction:column;gap:4px}
.slider .top2{display:flex;justify-content:space-between;font-size:14px;font-weight:600;gap:8px}
.slider input[type=range]{accent-color:var(--dale);width:100%}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:8px 10px;border-radius:8px;white-space:nowrap;z-index:5;transform:translate(-50%,-110%)}
/* bracket bars */
.bar{background:var(--line2);border-radius:4px;height:12px;overflow:hidden}
.bar>div{height:12px;border-radius:4px}
.ms{display:flex;gap:12px;font-size:14px}.ms b{width:86px;flex:0 0 86px;color:var(--muted)}
/* unlock */
.lock{min-height:100vh;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:30px 16px}
.lockbox{width:100%;max-width:470px;display:flex;flex-direction:column;gap:18px}
.lockbox .t{color:#fff;text-align:center}
.lockbox .t div:first-child{font-size:26px;font-weight:700}
.lockbox .t div:last-child{font-size:14px;color:#B8C2CC}
.panel{background:#fff;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who label{border:1px solid #C9D0D7;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.who label.on{border:2px solid var(--dale)}
.sec{background:#26333F;color:#DCE3EA;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.5}
.err{color:var(--bad);font-size:14px;font-weight:600}
.rkey{font:700 20px/1.4 Consolas,monospace;letter-spacing:.06em;background:var(--bg);border-radius:8px;padding:12px;text-align:center;word-break:break-all}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.2)}
@media (max-width:760px){
 .top{padding:10px 12px;gap:8px;position:static}
 .top .file,.top .status{display:none}
 .top .brand{font-size:16px;flex:1 1 auto}
 .top .grow{display:none}
 .top .seg{order:5;flex:1 1 auto}
 .top .seg button{flex:1 1 0;padding:7px 8px}
 nav.side{max-width:none;flex:1 1 100%;flex-direction:row;overflow-x:auto;position:sticky;top:0;z-index:15;background:var(--bg);padding:8px 10px;gap:6px;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line)}
 nav.side button{white-space:nowrap;padding:8px 12px;font-size:14px;flex:0 0 auto;background:#fff;border:1px solid var(--line)}
 nav.side button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
 main{padding:14px 12px 40px;gap:14px}
 h1{font-size:22px}
 .card{padding:14px}
 .k-val{font-size:24px}
 .grid2{grid-template-columns:minmax(0,1fr)}
 .grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
 input.in,select.in,.lock input.in{font-size:16px}
 .head .ml{margin-left:0}
 .inc .r2{grid-template-columns:minmax(0,1fr)}
 .ms b{width:70px;flex:0 0 70px}
}
.nojs{background:#B42318;color:#fff;padding:16px 20px;font:16px/1.5 system-ui,sans-serif}
.nojs b{display:block;font-size:18px;margin-bottom:4px}
@media print{.top,nav.side,.btn,.ibtn{display:none!important}main{padding:0}}

td.nw,th.nw{white-space:nowrap}
td.ev{min-width:260px}
.inc{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:8px;align-items:center;border-top:1px solid var(--line2);padding-top:10px}
.inc .r2{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}

details.help summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::before{content:'+';font-weight:700;color:var(--dale);width:16px}
details.help[open] summary::before{content:'–'}
details.help summary h2{display:inline}
.hbody{font-size:15px;line-height:1.6;color:var(--ink2)}
.hbody ul,.hbody ol{margin:6px 0;padding-left:22px}.hbody li{margin:4px 0}
.hbody dt{font-weight:700;color:var(--ink);margin-top:8px}.hbody dd{margin:2px 0 0 0}
.helpnav{display:flex;flex-wrap:wrap;gap:6px}
.helpnav a{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none}
.lock .card.help,.lock .helpnav a{background:#fff}
.lock .lab{color:#fff}
@media print{.helpnav,#helpQ,.lab[for=helpQ]{display:none!important}details.help{break-inside:avoid;border:0}}
details.help{scroll-margin-top:80px}
details.help:not([open]){gap:0;padding-top:14px;padding-bottom:14px}
</style>

function rpEnvironment() {

}
function rpCompareVersions(a, b) {
  var x = String(a || '0').split('.').map(Number), y = String(b || '0').split('.').map(Number);
  for (var i = 0; i < 3; i++) { var d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0 ? 1 : -1; }
  return 0;
}
if (typeof module !== 'undefined') module.exports = { RP_VERSION: RP_VERSION, RP_CHANGES: RP_CHANGES, rpCompareVersions: rpCompareVersions };

/* Retirement Planner – calculation engine (no UI, no network) */
var RPE = (function () {
  'use strict';
  var DAY = 86400000;

  function d(s) { return s ? new Date(s + 'T00:00:00') : null; }
  function fyStart(fy) { return new Date(fy - 1, 6, 1); }
  function fyEnd(fy) { return new Date(fy, 6, 1); }
  function fyOf(date) { return date.getMonth() >= 6 ? date.getFullYear() + 1 : date.getFullYear(); }
  function fyLabel(fy) { return 'FY ' + String(fy - 1).slice(2) + '–' + String(fy).slice(2); }
  function ageAt(dob, date) {
    var a = date.getFullYear() - dob.getFullYear();
    if (date.getMonth() < dob.getMonth() || (date.getMonth() === dob.getMonth() && date.getDate() < dob.getDate())) a--;
    return a;
  }
  // fraction of a year that [a,b) overlaps with [lo,hi)
  function overlap(lo, hi, a, b) {
    var s = Math.max(lo.getTime(), a ? a.getTime() : -Infinity);
    var e = Math.min(hi.getTime(), b ? b.getTime() : Infinity);
    return e > s ? (e - s) / (365.25 * DAY) : 0;

  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

  function minDrawRate(age, A) {

    return r;
  }

  function bracketsFor(fy, A) {
    var best = A.taxYears[0];
    for (var i = 0; i < A.taxYears.length; i++) if (A.taxYears[i].fromFY <= fy) best = A.taxYears[i];
    return best.brackets;
  }

  // Resident income tax for one person for one FY. Returns breakdown.
  function incomeTax(taxable, fy, A) {
    taxable = Math.max(0, taxable);
    var br = bracketsFor(fy, A), parts = [], gross = 0;
    for (var i = 0; i < br.length; i++) {
      var lo = br[i][0], hi = i + 1 < br.length ? br[i + 1][0] : Infinity, rate = br[i][1];
      var amt = Math.max(0, Math.min(taxable, hi) - lo);
      var t = amt * rate;
      gross += t;
      parts.push({ from: lo, to: hi, rate: rate, income: amt, tax: t });
    }
    // Low income tax offset
    var lito = 0;
    if (A.lito) {

      else if (taxable <= 45000) lito = 700 - (taxable - 37500) * 0.05;

  function effective(plan, scen) {

    var A = JSON.parse(JSON.stringify(plan.assumptions));
    var P = JSON.parse(JSON.stringify(plan.people));
    var s = scen || {};

  }

  function budgetTotals(plan) {
    var t = { dale: { now: 0, ret: 0 }, sue: { now: 0, ret: 0 } };

  /* Main projection. opts: {today: Date, scenario, horizonAge} */

    opts = opts || {};
    var today = opts.today || new Date();
    var E = effective(plan, opts.scenario);
    var A = E.A, P = E.P;

 ['dash', 'Dashboard', `

 ['budget', 'Budget – adding, changing and deleting expenses', `

 ['tax', 'Income & Tax', `

 ['savings', 'Savings & Super', `
<ul>

 ['users', 'Passwords, recovery key and access', `

 ['terms', 'Glossary', `
<dl>
<dt>Accumulation (super)</dt><dd>Super while you're still working or under 60 – earnings taxed at 15%.</dd>
<dt>Pension phase / account-based pension</dt><dd>Super paying you an income after retirement – tax-free from 60, with a minimum yearly withdrawal (4% under 65, 5% from 65, rising with age).</dd>
<dt>Defined benefit</dt><dd>A scheme such as QSuper's – a set amount worked out as multiple × final salary, not based on market returns.</dd>
<dt>Preservation age</dt><dd>60 – the age super can be accessed once retired.</dd>
<dt>Marginal rate</dt><dd>The tax rate on your next dollar of income (includes the 2% Medicare levy).</dd>
<dt>Effective rate</dt><dd>Total tax ÷ taxable income.</dd>
<dt>Franking credits</dt><dd>Tax already paid by a company on dividends – refunded or used to reduce your tax.</dd>
<dt>Age Pension assets/income tests</dt><dd>Centrelink checks both and pays the lower result. Your home isn't counted.</dd>
<dt>Today's dollars vs future dollars</dt><dd>Today's dollars remove inflation, so $120k means what $120k buys now. Charts and tables show future dollars.</dd>
</dl>`],

<li>Age Pension figures are estimates – check with Services Australia closer to 67.</li>
<li>This is a planning tool, not financial or tax advice. Run big decisions past a licensed adviser or accountant.</li>

  function chartSVG(res) {
    var rows = res.rows.filter(function (r) { return r.p.dale.age <= S.plan.assumptions.planToAge + 3; });
    var W = 1000, H = 330, padL = 56, padB = 34, padT = 40, ws = whoList();
    var max = 0;
    rows.forEach(function (r) { var t = 0; ws.forEach(function (w) { t += r.p[w].total; }); if (t > max) max = t; });
    if (max <= 0) max = 1;
    var step = Math.pow(10, Math.floor(Math.log10(max))); var nice = Math.ceil(max / step) * step; if (nice / step < 3) { step /= 2; }
    var lab = 0;
    var bw = (W - padL - 10) / rows.length, gap = Math.max(1, Math.min(4, bw * 0.2));
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Projected balances by year"><g font-size="11" fill="#5B6672">';
    for (var v = 0; v <= nice + 1; v += step) {
      var yy = padT + (H - padT - padB) * (1 - v / nice);
      s += '<line x1="' + padL + '" x2="' + (W - 6) + '" y1="' + yy + '" y2="' + yy + '" stroke="#E3E7EC"/><text x="' + (padL - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + kM(v) + '</text>';
    }
    rows.forEach(function (r, i) {

      segs.forEach(function (sg, j) {
        var hh = (H - padT - padB) * sg[1] / nice; if (hh <= 0) return;
        var top = j === segs.length - 1 || segs.slice(j + 1).every(function (q) { return q[1] <= 0; });
        y0 -= hh;
        var col = sg[0] === 'dale' ? '#2457C5' : '#E8913A';
        s += '<rect x="' + x.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + (bw - gap).toFixed(1) + '" height="' + Math.max(0, hh - (j > 0 ? 0 : 0)).toFixed(1) + '" fill="' + col + '" rx="' + (top ? 2 : 0) + '"/>';
        if (j < segs.length - 1) s += '<rect x="' + x.toFixed(1) + '" y="' + (y0 - 1).toFixed(1) + '" width="' + (bw - gap).toFixed(1) + '" height="2" fill="#fff"/>';
      });
      s += '<rect class="hit" data-tip="' + esc(tip) + '" x="' + (padL + i * bw).toFixed(1) + '" y="' + padT + '" width="' + bw.toFixed(1) + '" height="' + (H - padT - padB) + '" fill="transparent"/>';
      var aw = ws.length === 1 ? ws[0] : 'dale';
      if (r.p[aw].age % 5 === 0) s += '<text x="' + (x + (bw - gap) / 2).toFixed(1) + '" y="' + (H - padB + 14) + '" text-anchor="middle">' + r.fy + '</text><text x="' + (x + (bw - gap) / 2).toFixed(1) + '" y="' + (H - padB + 27) + '" text-anchor="middle">' + esc(pname(aw)) + ' ' + r.p[aw].age + '</text>';
      r.events.forEach(function (e) { if (/retires/.test(e.text) && ws.indexOf(e.who) >= 0) { lab++; s += '<line x1="' + (x - gap / 2).toFixed(1) + '" x2="' + (x - gap / 2).toFixed(1) + '" y1="' + (2 + 15 * lab) + '" y2="' + (H - padB) + '" stroke="#15202B" stroke-dasharray="3 3"/><text x="' + (x + 2).toFixed(1) + '" y="' + (11 + 15 * (lab - 1)) + '" fill="#15202B" font-weight="600">' + esc(e.text) + '</text>'; } });
    });
    s += '<line x1="' + padL + '" x2="' + (W - 6) + '" y1="' + (H - padB) + '" y2="' + (H - padB) + '" stroke="#C9D0D7"/></g></svg>';
    return s;
  }

  /* ---------- Income & Tax ---------- */

  /* ---------- Forecast & Scenarios ---------- */
  var SF = [ // field, label, type, base path, min, max, step

  function runScen(sc, pooled) { var o = scenOverrides(sc); o.pooled = pooled == null ? S.plan.settings.pooled : pooled; return RPE.project(S.plan, { today: C.today, scenario: o }); }

      plan.scenarios[0].note = n1 + ' retires ' + plan.people.dale.retireDate.slice(0, 4);
      var r = await Vault.create(plan, { dale: a, sue: c || null }, 'dale');
      S.file = r.file; S.dataKey = r.dataKey; S.plan = null; S.pendingPlan = plan; S.newRecovery = r.recoveryKey; S.busy = false; S.stage = 'recovery'; renderLock();
    },
    afterCreate: async function () {
      if (!document.getElementById('rkOk').checked) { alert('Please tick the box once you have written the recovery key down.'); return; }
      try { var res = await Files.save(S.file, true); S.plan = S.pendingPlan; S.user = 'dale'; S.newRecovery = null; S.tab = 'dashboard'; S.dirty = false; S.lastSaved = new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }); render(); toast(res.mode === 'download' ? 'Downloaded ' + res.name + ' – move it into your OneDrive folder.' : 'Plan saved to ' + res.name); }
      catch (e) { if (e.name !== 'AbortError') alert('Could not save: ' + e.message); }
    }
  };

  /* ---------- events ---------- */
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t || t.tagName === 'SELECT') return;
    if (t.type === 'radio' || t.type === 'checkbox') { if (A[t.dataset.act]) A[t.dataset.act](t.dataset.id); return; }
    var f = A[t.dataset.act]; if (f) { e.preventDefault(); f(t.dataset.id); }
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.act === 'lockMins') { S.lockMins = +t.value; return; }
    if (t.dataset.bind) {
      var type = t.dataset.type, v = type === 'bool' ? t.checked : parseVal(t.value, type);
      setPath(t.dataset.bind, v);
      if (t.dataset.grp) S.plan.assumptions.updated[t.dataset.grp] = new Date().toISOString().slice(0, 10);
      if (type === 'sel' && /accounts:.*:type$/.test(t.dataset.bind)) { var acc = S.plan.accounts.filter(function (a) { return a.id === t.dataset.bind.split(':')[1]; })[0]; if (acc && acc.type === 'db' && acc.leaveDate == null) { acc.leaveDate = ''; acc.dest = 'pension'; acc.override = ''; } }
      markDirty(); render(); return;
    }
    if (t.dataset.per) { var ex = S.plan.expenses.filter(function (x) { return x.id === t.dataset.id; })[0]; ex.yearly = Math.round(parseVal(t.value, 'money') * (+t.dataset.per) * 100) / 100; markDirty(); render(); return; }
    if (t.dataset.scen) { var sc = scenById(S.scen); sc[t.dataset.scen] = t.value; markDirty(); render(); return; }
    if (t.dataset.sf) {
      var f = SF.filter(function (x) { return x[0] === t.dataset.sf; })[0], sc2 = scenById(S.scen);
      var val = f[2] === 'date' ? t.value : +t.value;
      if (f[0] === 'splitPct' && S.view === 'sue') val = 100 - val; // Sue's view shows her share
      if (sc2.id === 'base') { if (f[3]) setPath(f[3], val); else sc2.stress = val; } else sc2[f[0]] = val;
      markDirty(); render();
    }
  });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.sf && t.type === 'range') { var lab = t.parentNode.querySelector('.top2 span:last-child'); var f = SF.filter(function (x) { return x[0] === t.dataset.sf; })[0]; var v = +t.value; lab.textContent = f[2] === 'pct' ? pct(v, f[0] === 'stress' ? 0 : 2) : f[2] === 'money' ? money(v) : Math.round(v) + '%'; }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'helpQ') { S.helpQ = e.target.value; var pos = e.target.selectionStart; if (S.plan) render(); else renderLock(); var q = document.getElementById('helpQ'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
  });
  app.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'pw') unlockNow(); });
  // chart tooltip
  app.addEventListener('mousemove', function (e) {
    var t = e.target, ch = document.getElementById('chart'); if (!ch) return;
    var tt = ch.querySelector('.tt');
    if (t.classList && t.classList.contains('hit')) {
      if (!tt) { tt = document.createElement('div'); tt.className = 'tt'; ch.appendChild(tt); }
      var r = ch.getBoundingClientRect(); tt.style.left = (e.clientX - r.left) + 'px'; tt.style.top = (e.clientY - r.top) + 'px'; tt.textContent = t.getAttribute('data-tip');
    } else if (tt) tt.remove();
  });
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 's' && S.plan) { e.preventDefault(); saveNow(false); } });
  window.addEventListener('beforeunload', function (e) { if (S.plan && S.dirty) { e.preventDefault(); e.returnValue = ''; } });
  // auto-lock
  var idle = Date.now();
  ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, function () { idle = Date.now(); }, { passive: true }); });
  setInterval(function () { if (S.plan && Date.now() - idle > S.lockMins * 60000) lockNow(true); }, 30000);
  function afterRender() {}

  // start
  Files.lastName().then(function (n) { S.lastName = n; renderLock(); });
  renderLock();
  window.__RP = S;
})();

</script>
